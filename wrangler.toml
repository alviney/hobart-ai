# Cloudflare Workers + D1 (D-019). Deployed by Cloudflare from GitHub: build `npm run build`, deploy `npx wrangler deploy`.
name = "sub1"
main = "server/worker.ts"
compatibility_date = "2025-06-01"

# The built web app. Cloudflare serves these files directly; only /api/* runs the Worker,
# and any other unknown path gets index.html so links into the app work.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sub1"
database_id = "48029c18-1bc4-4216-a06e-fc65214b1539"

# Pull-request previews (`npx wrangler preview`) use a separate database so they
# never touch production data. The app creates tables and sample data on first use.
[[previews.d1_databases]]
binding = "DB"
database_name = "sub1-preview"
database_id = "92797cf9-59c8-4a4d-a501-708b0f1f8816"
