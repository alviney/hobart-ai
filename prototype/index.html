<style>
/* Layout: one phone-sized app column, centred on desktop, filling the width on a phone. Single light look by choice (D-005); the radar is a dark sonar screen. */
:root {

}

.bar { width: 100%; max-width: 760px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 14px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; }

.phone { position: relative; width: min(390px, 100%); height: min(844px, calc(100% - 76px)); min-height: 560px; background: var(--app, #FFFFFF); color: var(--ink); border-radius: 40px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; margin-bottom: 16px; }

.fhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }

/* Feed rows: same height; rating marker | title + Trove | time */

.rate { --rc: #8C99A3; justify-self: center; width: 10px; height: 10px; border-radius: 5px; background: var(--rc); display: inline-flex; align-items: flex-end; gap: 2px; }
.rate.r4 { --rc: #D9480F; } .rate.r3 { --rc: #1D5C86; } .rate.r2 { --rc: #2F9E44; } .rate.r1 { --rc: #8C99A3; }

/* Deep Sonar (D-010): dark hull, glowing accents */
.phone { --app: #0B1A24; --surface: #13242F; --soft: #172B38; --ink: #E6F1F7; --body: #C5D4DD; --muted: #8FA6B4; --line: #23404F; --primary: #1E78A8; --primary-ink: #9CD6F0; --tint: #163246; --tint-2: #1E4058; --input: #0F202B; }
.rate.r4 { --rc: #FF8A5B; } .rate.r3 { --rc: #6FC3EC; } .rate.r2 { --rc: #7BD88F; } .rate.r1 { --rc: #9FB4C2; }
.radar-btn { background: #1E78A8 !important; color: #FFFFFF !important; }
.wordmark svg { color: #9CD6F0 !important; }

.fpick { min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; color: var(--body); display: inline-flex; align-items: center; gap: 8px; }
.fpick .rate { width: 8px; height: 8px; }
.fmenu { position: absolute; right: 0; top: 42px; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; min-width: 200px; box-shadow: 0 14px 34px rgba(0,0,0,.45); display: flex; flex-direction: column; }
.fmenu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 10px 12px; border-radius: 12px; text-align: left; font-weight: 600; font-size: 14px; min-height: 44px; color: var(--ink); }
.fmenu button[aria-pressed="true"], .fmenu button:hover { background: var(--soft); }
.fmenu .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }

/* Trove rows: one per Trove. rating circle | Trove name + latest ping | time + unread */
.trow { height: 66px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; color: var(--ink); }

.latest { border: 0; text-align: left; width: 100%; padding: 22px; border-radius: 28px; background: var(--tint); display: flex; flex-direction: column; gap: 10px; color: var(--ink); }

.btn { height: 54px; border-radius: 99px; border: 0; background: var(--primary); color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 0 26px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.panel { padding: 18px; border-radius: 24px; border: 2px solid #E1E7EB; display: flex; flex-direction: column; gap: 12px; }
.minirow { display: flex; gap: 14px; align-items: center; }

.radar-btn { width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 0; background: var(--sonar); color: var(--sonar-glow); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(20,33,43,.22); }

.meter.s4 i, .meter.s3 i:nth-child(-n+3), .meter.s2 i:nth-child(-n+2), .meter.s1 i:nth-child(1) { background: var(--primary); }

.radar-screen { background: var(--sonar); color: #E6F1F7; }
.radar-screen .back { color: var(--sonar-glow); }
.radar-screen .sub { color: #9FB4C2; }
.radar { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; align-self: center; border-radius: 50%; background: radial-gradient(circle, #153044 0%, #0F2131 70%); overflow: hidden; border: 1px solid var(--sonar-line); flex-shrink: 0; }
.radar svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; }

<script>
(() => {
  const LEVELS = { 4: 'Urgent', 1: 'Not urgent' };
  const LINE = { 4: 'Urgent only', 1: 'Everything' };
  const VIA = ['Email', 'My AI only', 'Webhook', 'SMS'];
  const KINDS = ['Club or team', 'School group', 'Business', 'Neighbours', 'Something else'];
  const STRENGTH = { 4: 'Strong ping', 3: 'Good ping', 2: 'Weak ping', 1: 'Faint ping' };
  const RANGE = 2500; // metres shown at the radar's edge
  const EMPTY_AUD = () => ({ 4: 0, 1: 0, ai: 0 });

  // Ping strength comes from how recently the Trove's owner confirmed its details.
  const strength = (days) => days <= 7 ? 4 : days <= 30 ? 3 : days <= 90 ? 2 : days <= 180 ? 1 : 0;
  const ago = (d) => d === 0 ? 'today' : d === 1 ? 'yesterday' : d < 14 ? `${d} days ago` : d < 60 ? `${Math.round(d / 7)} weeks ago` : `${Math.round(d / 30)} months ago`;
  const km = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;

  const fresh = () => ({
    v: 9, fmenu: false, troveId: null, back: 'home', pingId: null, screen: 'home', open: {}, filter: 'all', connId: null, showQuiet: false, pullOnly: false, sheet: null,
    draft: { text: '', pri: 1, manual: false, ch: null }, subId: 'elm', scanLevel: 1, seq: 100,
    newCh: { name: '', kind: 'Club or team', access: 'invite' }, addingDoc: false, chat: [],
    connections: [
      { id: 'netball', name: 'South Hobart Netball U12s', short: 'Netball U12s', level: 1, via: 'Email', on: true, joined: true, verified: 3, dist: 1200, bearing: 165,
        docs: [
          { t: 'Season overview', b: 'Games are on Saturday mornings at the Domain courts. Arrive 20 minutes before your game. Bring a water bottle and your bib.' },
          { t: 'Wet weather plan', b: "If it's raining at 7am, check for an Urgent ping by 7:30am. No ping means we play." },
          { t: 'Uniforms and canteen', b: 'Navy skirt or shorts with the club top. Two families run the canteen each week; canteen families arrive at 8:30am.' }
        ] },
      { id: 'pf', name: 'Lansdowne Primary P&F', short: 'Lansdowne P&F', level: 4, via: 'Email', on: true, joined: true, verified: 20, dist: 800, bearing: 80,
        docs: [
          { t: 'Term dates', b: 'Term 4 runs until Friday 18 December. Pupil-free day on Friday 20 November.' },
          { t: 'Before and after care', b: 'Runs 7:30–8:45am and 3:00–6:00pm in the hall, including pupil-free days. Book through the office.' }
        ] },
      { id: 'elm', name: 'Elm St Bakehouse', short: 'Elm St Bakehouse', level: 1, via: 'Email', on: true, joined: false, verified: 2, dist: 350, bearing: 35,
        docs: [
          { t: 'Opening hours', b: 'Tuesday to Sunday, 7am to 3pm. Closed Mondays and public holidays.' },
          { t: 'Pre-orders', b: 'Order whole loaves and hot cross buns by 2pm the day before. Pick up from 7am.' }
        ] },
      { id: 'landcare', name: 'Mt Stuart Landcare', short: 'Mt Stuart Landcare', level: 1, via: 'My AI only', on: true, joined: true, verified: 60, dist: 2100, bearing: 255,
        docs: [ { t: 'Working bees', b: 'Second Sunday of every month, 9am at the Mt Stuart Rd gate. Bring gloves, water and sturdy shoes. Tools and morning tea provided.' } ] },
      { id: 'bodycorp', name: 'Waterside Body Corporate', short: 'Waterside Body Corp', level: 4, via: 'Email', on: false, joined: true, verified: 140, dist: 120, bearing: 320,
        docs: [ { t: 'Bin days', b: 'General waste Tuesday night, recycling every second Thursday.' } ] },
      { id: 'garden', name: 'Lenna Ave Community Garden', short: 'Lenna Ave Garden', level: 1, via: 'Email', on: true, joined: false, verified: 12, dist: 620, bearing: 205,
        docs: [ { t: 'Plots and watering', b: 'Plots are $20 a year. The watering roster is on the shed door; take one evening a fortnight.' } ] },
      { id: 'records', name: 'Back Alley Records', short: 'Back Alley Records', level: 1, via: 'Email', on: true, joined: false, verified: 45, dist: 950, bearing: 300,
        docs: [ { t: 'Opening hours', b: 'Thursday to Saturday, 11am to 5pm.' } ] },
      { id: 'rivulet', name: 'Rivulet Track Friends', short: 'Rivulet Track Friends', level: 1, via: 'Email', on: true, joined: false, verified: 120, dist: 1500, bearing: 120,
        docs: [ { t: 'Clean-up days', b: 'We meet at the Molle St end, first Saturday of the month.' } ] },
      { id: 'pantry', name: 'Corner Pantry', short: 'Corner Pantry', level: 1, via: 'Email', on: true, joined: false, verified: 230, dist: 400, bearing: 140, docs: [] }
    ],
    posts: [
      { id: 1, conn: 'netball', pri: 1, text: 'Saturday games move to 9am at the Domain courts. Same team sheet.', time: '7:40am' },
      { id: 2, conn: 'pf', pri: 4, title: "Friday closure: what's open and what isn't", text: "School is closed this Friday while Aurora upgrades the power to the new building. The upgrade can't happen with students on site, so it's a full closure, not a pupil-free day.\n\nBefore-care and after-care are still running in the hall from 7:30am to 6pm. Book through the office by Thursday at 3pm so we have enough staff.\n\nThe canteen is closed, so pack lunch if your child is in care. The uniform shop will open on Monday instead.\n\nIf you can't find care, reply to this ping and we'll try to match you with another family. Thanks for your patience; the new building opens in Term 1.", time: 'Yesterday' },
      { id: 3, read: true, conn: 'elm', pri: 1, text: 'Hot cross buns are back from Monday. Pre-orders open now.', time: 'Yesterday' },
      { id: 4, conn: 'landcare', pri: 1, title: 'The creek, one year on', text: "A year ago the bank along Mt Stuart Rd was blackberry and broken glass. Since then 41 of you have planted 1,860 natives over eleven working bees.\n\nThe survival rate is 82%, well above the 60% we hoped for. The wattles are head height and the tussocks have closed the gaps that were washing out in every storm. Last month someone spotted a platypus below the footbridge for the first time in years.\n\nNext up is the steep section near the gate. It needs jute matting before we plant, so this Sunday is a matting day: gloves and sturdy shoes, and we'll have the stakes and mallets. 9am at the gate, morning tea at 11.", time: 'Yesterday' },
      { id: 5, read: true, conn: 'netball', pri: 1, text: 'Photos from last week are up in the club gallery.', time: 'Mon' },
      { id: 6, conn: 'pf', pri: 1, text: 'Second-hand uniform sale next Wednesday after school.', time: 'Mon' },
      { id: 7, read: true, conn: 'bodycorp', pri: 1, text: 'Gardeners are in on Thursday morning.', time: 'Mon' },
      { id: 8, read: true, conn: 'elm', pri: 1, text: 'New sourdough rye on the shelves this week.', time: 'Sun' },
      { id: 9, read: true, conn: 'garden', pri: 1, text: 'Seedling swap at the shed this Saturday, 10am.', time: 'Sun' },
      { id: 10, conn: 'netball', pri: 1, title: 'Finals day: everything you need to know', text: "We made the grand final! It's on Saturday 29 November at the Domain courts, court 3, at 10:20am. Please have players there by 9:50 for warm-up.\n\nUniforms: full club kit, including the navy socks. If your child has lost theirs, we have spares at the canteen.\n\nParking fills up fast on finals day. The Queens Walk car park is the best bet, or the 9:30 bus from the city stops right outside.\n\nAfter the game we're doing a team breakfast at Elm St Bakehouse. The club is covering the players; parents pay their own. Let me know by Thursday if you're coming so I can give them numbers.\n\nWin or lose, it's been a brilliant season. Thanks for every early morning, every lift and every orange quarter.", time: '8:15am' }
    ]
  });

  let S = fresh();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const conn = (id) => S.connections.find((c) => c.id === id);
  const owned = () => S.connections.filter((c) => c.owner);
  const subs = (c) => c.audience ? c.audience[1] + c.audience[4] + c.audience.ai : 0;
  const tag = (p) => p === 4 ? '<span class="tag t4">Urgent</span>' : '';
  const meter = (s) => `<span class="meter s${s}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
  const pings = (p) => { const c = conn(p.conn); return !c.owner && c.on && !S.pullOnly && c.via !== 'My AI only' && p.pri >= c.level; };
  const myPosts = () => S.posts.filter((p) => conn(p.conn).joined).sort((a, b) => b.id - a.id);
  const scrollTop = () => { $('screen').scrollTop = 0; };

  const svg = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
  const icon = {
    menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
    people: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>'),
    plus: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'),
    pen: svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/>'),
    scan: svg('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/>'),
    plug: svg('<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v4"/>'),
    radar: svg('<circle cx="12" cy="12" r="9" opacity=".45"/><circle cx="12" cy="12" r="5" opacity=".7"/><path d="M12 12 18.4 5.6"/><circle cx="16" cy="9" r="1.3" fill="currentColor" stroke="none"/>'),
    sonar: svg('<path d="M12 12h.01"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>', 'stroke-width="2.4"')
  };

  // A QR-like pattern: finder squares in three corners, seeded noise elsewhere. Visual only.
  const qrSvg = (() => {
    const n = 25; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const finder = (x, y) => x < 7 && y < 7 || x >= n - 7 && y < 7 || x < 7 && y >= n - 7;
    let r = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let on;
      if (finder(x, y)) { const fx = x >= n - 7 ? x - (n - 7) : x; const fy = y >= n - 7 ? y - (n - 7) : y; on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4); }
      else if (x === 7 || y === 7 || (x === n - 8 && y < 8) || (y === n - 8 && x < 8)) on = false;
      else on = rnd() > 0.52;
      if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    return `<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" fill="#14212B" role="img" aria-label="QR code">${r}</svg>`;
  })();

  function suggest(text) {
    const t = text.toLowerCase();
    if (!t.trim()) return null;
    if (/(cancel|closed|close |emergency|urgent|today only|evacuat|not on)/.test(t)) return { pri: 4, why: 'it cancels or closes something people were counting on' };
    return { pri: 1, why: "people can catch up on it when they next look" };
  }
  function reachFor(c, pri) {
    const a = c.audience || EMPTY_AUD();
    let pinged = 0, quiet = 0;
    for (const t of [1, 4]) (t <= pri ? (pinged += a[t]) : (quiet += a[t]));
    return { pinged, quiet, ai: a.ai };
  }
  const isLong = (p) => !!p.title || p.text.length > 240;
  const pingRow = (p, dim) => `<button type="button" class="prow ${dim ? 'dim' : ''}" data-act="open-ping" data-arg="${p.id}">
      <span class="pmain"><span class="ttl">${p.wasUnread ? '<span class="newdot" aria-label="Unread"></span>' : ''}${esc(p.title || p.text)}</span><span class="pmeta">${[p.pri === 4 ? '<span class="urg">Urgent</span>' : '', !pings(p) && !conn(p.conn).owner ? 'Didn’t notify you' : '', p.title ? esc(p.text) : ''].filter(Boolean).join(' · ') || esc(p.time)}</span></span>
      <span class="when">${esc(p.time)}</span></button>`;
  const pingList = (list, dimFn) => `<div class="plist">${list.map((p) => pingRow(p, dimFn && dimFn(p))).join('')}</div>`;
  const pingCard = (p, belowLine) => {
    const meta = `<div class="meta">${tag(p.pri)}${belowLine ? '<span class="below">Didn’t notify you</span>' : ''}${conn(p.conn).owner ? '<span class="tag you">You</span>' : ''}${p.isNew ? '<span class="tag new">New</span>' : ''}<span>${esc(conn(p.conn).short)} · ${esc(p.time)}</span></div>`;
    if (!isLong(p)) return `<article class="card">${meta}<p class="msg">${esc(p.text)}</p></article>`;
    const open = !!S.open[p.id];
    return `<article class="card">${meta}${p.title ? `<h3 class="ping-title">${esc(p.title)}</h3>` : ''}
      <p class="ping-body ${open ? '' : 'clamp'}" id="ping-${p.id}">${esc(p.text)}</p>
      <button type="button" class="more-btn" data-act="expand" data-arg="${p.id}" aria-expanded="${open}" aria-controls="ping-${p.id}">${open ? 'Show less' : 'Read more'}</button></article>`;
  };

  // ---------- Home: the full feed ----------
  function home() {
    const f = S.filter;
    const mine = myPosts().filter((p) => f === 'all' || p.pri === f);
    const count = (l) => myPosts().filter((p) => p.pri === l).length;
    const groups = [];
    for (const p of mine) { let g = groups.find((x) => x.c.id === p.conn); if (!g) groups.push(g = { c: conn(p.conn), list: [] }); g.list.push(p); }
    const sel = (v) => String(f) === String(v);
    const label = f === 'all' ? 'All' : 'Urgent';
    const menu = S.fmenu ? `<div class="fmenu" role="menu"><button type="button" aria-pressed="${sel('all')}" data-act="filter" data-arg="all">All pings<span class="n">${myPosts().length}</span></button><button type="button" aria-pressed="${sel(4)}" data-act="filter" data-arg="4"><span class="rate r4"></span>Urgent only<span class="n">${count(4)}</span></button></div>` : '';
    const rows = groups.map(({ c, list }) => {
      const latest = list[0], unread = list.filter((p) => !p.read).length, top = list.filter((p) => !p.read).reduce((m, p) => Math.max(m, p.pri), 0) || latest.pri;
      const muted = !c.owner && (!c.on || c.via === 'My AI only' || S.pullOnly);
      return `<button type="button" class="trow ${unread ? '' : 'read'} ${muted ? 'muted' : ''}" data-act="open-trove" data-arg="${c.id}">
        <span class="pmain"><span class="tname">${c.owner ? 'You · ' : ''}${esc(c.name)}</span><span class="tlast">${esc(latest.title || latest.text)}</span></span>
        <span class="tside"><span class="when">${esc(latest.time)}</span><span class="unread ${unread ? '' : 'zero'} ${top === 4 && unread ? 'urgent' : ''}" aria-label="${unread} unread${top === 4 && unread ? ', including urgent' : ''}">${unread}</span></span></button>`;
    }).join('');
    return `<div class="topline"><button type="button" class="iconbtn" data-act="menu" aria-label="Menu">${icon.menu}</button>
        <span class="wordmark" style="flex:1">${icon.sonar}Sub1</span>
        <button type="button" class="radar-btn" data-act="go" data-arg="radar" aria-label="Radar: Troves near you">${icon.radar}</button></div>
      <div class="fhead"><h2>Pings</h2><button type="button" class="fpick" data-act="fmenu" aria-expanded="${!!S.fmenu}">${f === 'all' ? '' : `<span class="rate r${f}"></span>`}${label} <span aria-hidden="true">▾</span></button>${menu}</div>
      ${S.pullOnly ? '<p class="sub">Pull only is on, so nothing pings you. Everything is here when you or your AI look.</p>' : ''}
      ${rows ? `<div class="plist">${rows}</div>` : `<div class="empty">No ${f === 'all' ? '' : 'urgent '}pings right now.</div>`}
      <p class="tagline">An orange count means one of the unread pings is urgent. Dimmed Troves don't notify you.</p>`;
  }

  // ---------- One Trove's pings ----------
  function troveFeed() {
    const c = conn(S.troveId);
    const list = S.posts.filter((p) => p.conn === c.id).sort((a, b) => b.id - a.id);
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Pings</button>
      <div class="row" style="flex-wrap:nowrap"><span class="avatar big ${c.owner ? 'ink' : ''}">${esc(c.name[0])}</span>
        <div class="grow"><h2>${esc(c.name)}</h2><span class="row" style="gap:8px">${meter(strength(c.verified || 0))}<span class="sub">${c.owner ? 'You run this' : LINE[c.level] + (c.on ? '' : ' · paused')}</span></span></div>
        <button type="button" class="link-btn" data-act="${c.owner ? 'open-mine' : 'open-conn'}" data-arg="${c.id}">${c.owner ? 'Manage' : 'Settings'}</button></div>
      ${list.length ? `<div class="plist">${list.map((p) => pingRow(p)).join('')}</div>` : '<div class="empty">No pings yet.</div>'}`;
  }



  // ---------- One ping ----------
  function pingView() {
    const p = S.posts.find((x) => x.id === S.pingId), c = conn(p.conn);

  }

  // ---------- Radar ----------
  function radar() {
    const all = S.connections.filter((c) => !c.owner && c.dist != null);
    const shown = all.filter((c) => strength(c.verified) > 0 && c.dist <= RANGE).sort((a, b) => a.dist - b.dist);
    const hidden = all.length - shown.length;
    const blips = shown.map((c) => {
      const s = strength(c.verified), r = (c.dist / RANGE) * 46, a = c.bearing * Math.PI / 180;
      const x = 50 + r * Math.sin(a), y = 50 - r * Math.cos(a), size = [0, 6, 8, 11, 13][s], op = [0, .3, .5, .8, 1][s];
      return `<button type="button" class="blip s${s} ${c.joined ? 'subd' : ''}" style="left:${x}%;top:${y}%;opacity:${op}" data-act="trove" data-arg="${c.id}" aria-label="${esc(c.name)}, ${STRENGTH[s]}, ${km(c.dist)}"><span style="width:${size}px;height:${size}px"></span></button>`;
    }).join('');
    const rows = shown.map((c) => {
      const s = strength(c.verified);
      return `<button type="button" class="trove-row" data-act="trove" data-arg="${c.id}">${meter(s)}
        <span class="grow" style="gap:3px"><span class="name">${esc(c.name)}</span><span class="sub">${STRENGTH[s]} · verified ${ago(c.verified)}</span></span>
        ${c.joined ? '<span class="tag plain">Subscribed</span>' : ''}<span class="dist">${km(c.dist)}</span></button>`;
    }).join('');
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Home</button>
      <h1>Radar</h1><p class="sub">Troves near you. Strong pings were confirmed by their owners recently. Weak ones may be out of date.</p>
      <div class="radar">
        <svg class="grid" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="rgba(156,195,222,.22)" stroke-width=".4">

          <g fill="rgba(156,195,222,.6)" font-size="3" font-family="Inter, sans-serif"><text x="51" y="34">800 m</text><text x="51" y="18.6">1.7 km</text><text x="51" y="3.4">2.5 km</text></g></svg>
        <div class="sweep" aria-hidden="true"></div>
        <span class="you-dot" aria-hidden="true"></span>
        ${blips}
      </div>
      <div class="legend"><span><b></b>Strong</span><span><b style="opacity:.45"></b>Weak</span><span><b style="background:#FFFFFF"></b>Subscribed</span></div>
      ${rows}
      ${hidden ? `<p class="sub" style="text-align:center">${hidden} Trove${hidden === 1 ? ' is' : 's are'} too faint to show. Their details haven't been confirmed in over six months.</p>` : ''}
      <p class="demo-note" style="color:#7F95A4">Your location stays on your phone. Prototype: positions are made up.</p>`;
  }
  function troveSheet(c) {
    const s = strength(c.verified);
    return `<div class="backdrop" data-act="sheet-close"></div>
      <div class="sheet" role="dialog" aria-label="${esc(c.name)}"><span class="grabber"></span>
        <div class="row" style="flex-wrap:nowrap"><span class="avatar big">${esc(c.name[0])}</span><div class="grow"><h2>${esc(c.name)}</h2><span class="sub">${km(c.dist)} away</span></div></div>
        <div class="setting" style="background:var(--soft)"><span class="row" style="gap:10px;flex-wrap:nowrap">${meter(s)}<span><b>${STRENGTH[s]}</b><br><span class="sub">Details confirmed by the owner ${ago(c.verified)}</span></span></span></div>
        ${c.docs.length ? `<p class="label">What's here</p>${c.docs.map((d) => `<details class="doc"><summary>${esc(d.t)}</summary><p>${esc(d.b)}</p></details>`).join('')}` : ''}
        ${c.joined
          ? `<button type="button" class="btn" data-act="open-conn" data-arg="${c.id}">Open Trove</button>`
          : `<button type="button" class="btn" data-act="sub-start" data-arg="${c.id}">Subscribe</button>`}
      </div>`;
  }

  // ---------- Troves you subscribe to ----------
  function troves() {
    const mine = owned().map((c) => `
      <button type="button" class="conn mine" data-act="open-mine" data-arg="${c.id}">
        <span class="avatar ink">${esc(c.name[0])}</span>
        <span class="grow"><span class="name">${esc(c.name)}</span>
          <span class="row" style="gap:6px"><span class="tag you">You run this</span><span class="tag plain"><span class="stat">${subs(c)}</span> subscribers</span></span></span>
        <span aria-hidden="true" style="color:var(--muted)">›</span></button>`).join('');
    const following = S.connections.filter((c) => c.joined && !c.owner).map((c) => `
      <button type="button" class="conn ${c.on ? '' : 'off'}" data-act="open-conn" data-arg="${c.id}">
        <span class="avatar">${esc(c.name[0])}</span>
        <span class="grow"><span class="name">${esc(c.name)}</span>
          <span class="row" style="gap:6px"><span class="tag ${c.level === 4 ? 't4' : 'plain'}">${LINE[c.level]}</span><span class="tag plain">${c.on ? esc(c.via) : 'Paused'}</span></span></span>
        ${meter(strength(c.verified))}</button>`).join('');
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Home</button><h1>Your Troves</h1>
      ${mine ? `<p class="section-h">Yours</p>${mine}` : ''}
      <p class="section-h">Subscribed</p>${following || '<div class="empty">No subscriptions yet. Try the radar.</div>'}
      <div class="row" style="margin-top:auto;flex-wrap:nowrap">
        <button type="button" class="btn dashed small" data-act="go" data-arg="scan" style="flex:1">+ Scan a code</button>
        <button type="button" class="btn dashed small" data-act="go" data-arg="start" style="flex:1">+ Start a Trove</button></div>`;
  }

  function connDetail() {
    const c = conn(S.connId), s = strength(c.verified);
    const recent = S.posts.filter((p) => p.conn === c.id).sort((a, b) => b.id - a.id).slice(0, 3);
    return `<button type="button" class="back" data-act="go" data-arg="troves">‹ Your Troves</button>
      <div class="row" style="flex-wrap:nowrap"><span class="avatar big">${esc(c.name[0])}</span><div class="grow"><h2>${esc(c.name)}</h2><span class="row" style="gap:8px">${meter(s)}<span class="sub">${s ? STRENGTH[s] : 'Too faint'} · verified ${ago(c.verified)}</span></span></div></div>
      <div class="setting"><span><b>Notifications</b><br><span class="sub">${c.on ? 'On' : 'Paused. Pings still land in your feed.'}</span></span>
        <button type="button" class="switch" role="switch" aria-checked="${c.on}" aria-label="Notifications" data-act="toggle-conn"><span></span></button></div>
      <p class="label">Ping me for</p>
      <div class="pills">${[1, 4].map((l) => `<button type="button" class="pill" aria-pressed="${c.level === l}" data-act="level" data-arg="${l}">${LINE[l]}</button>`).join('')}</div>
      <p class="label">How it reaches you</p>
      <div class="pills">${VIA.map((v) => `<button type="button" class="pill" aria-pressed="${c.via === v}" data-act="via" data-arg="${v}">${v === 'SMS' ? 'SMS · Plus' : v}</button>`).join('')}</div>
      <p class="label">Documents</p>
      ${c.docs.map((d) => `<details class="doc"><summary>${esc(d.t)}</summary><p>${esc(d.b)}</p></details>`).join('')}
      <p class="label">Recent pings</p>
      ${recent.map((p) => pingCard(p)).join('')}
      <button type="button" class="link-btn" data-act="leave" style="color:var(--urgent-fg);align-self:flex-start">Unsubscribe from ${esc(c.short)}</button>`;
  }

  function scan() {
    const c = conn('elm');
    return `<button type="button" class="back" data-act="go" data-arg="troves">‹ Your Troves</button>
      <h1>Scan a code</h1>
      <p class="sub">In real life you'd point your camera at a poster. Here, tap the one on the bakery counter.</p>
      <div class="counter"><p style="font-weight:700">On the counter at Elm St Bakehouse</p>
        <button type="button" data-act="${c.joined ? 'noop' : 'sub-start'}" data-arg="elm" aria-label="Scan the Elm St Bakehouse code" style="border:0;background:var(--primary);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#FFFFFF">
          <span class="qr" style="width:140px;height:140px">${qrSvg}</span>
          <span style="font-family:var(--display);font-weight:800;font-size:22px">Scan for live pings</span></button>
        <p style="font-size:13px">${c.joined ? "You're already subscribed to Elm St Bakehouse." : 'Tap the code to scan it'}</p></div>`;
  }

  function subscribe() {
    const c = conn(S.subId);
    const opts = [[1, 'Everything', 'Every ping they send'], [4, 'Urgent only', 'Closures, cancellations, things that can’t wait']];
    return `<div class="hero"><span class="sub">Subscribe to</span><h1 style="font-size:36px">${esc(c.name)}</h1><span>Choose how much you want to hear.</span></div>
      <div class="inner">
        <h2>Ping me for…</h2>
        ${opts.map(([l, t, s]) => `<button type="button" class="choice" aria-pressed="${S.scanLevel === l}" data-act="scan-level" data-arg="${l}"><span class="radio"></span><span class="grow" style="gap:2px"><b>${t}</b><span class="sub">${s}</span></span>${l === 4 ? '<span class="tag t4">Urgent</span>' : ''}</button>`).join('')}
        <label class="label" for="sub-email" style="margin-top:4px">Your email</label>
        <input class="input" id="sub-email" type="email" placeholder="you@example.com" autocomplete="off">
        <button type="button" class="btn" data-act="join" data-arg="Email">Subscribe</button>
        <button type="button" class="link-btn" data-act="join" data-arg="My AI only">Send pings to my AI instead</button>
        <button type="button" class="link-btn" data-act="go" data-arg="home" style="color:var(--muted)">Not now</button></div>`;
  }

  function joined() {
    const c = conn(S.subId);
    return `<div style="margin:auto 0;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center">
      <span class="avatar big">${esc(c.name[0])}</span><h1>You're subscribed</h1>
      <p class="sub" style="font-size:16px">${esc(c.name)} will ping you for <b>${LINE[c.level].toLowerCase()}</b>${c.via === 'My AI only' ? ', through your AI only' : ' by email'}. Change it any time in Your Troves.</p>
      <button type="button" class="btn" data-act="go" data-arg="feed">See your pings</button>
      <p class="sub">Got something to share? <button type="button" class="link-btn" data-act="go" data-arg="start" style="padding:0">Start a Trove</button></p></div>`;
  }

  // ---------- Troves you run ----------
  function start() {
    const n = S.newCh;
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Home</button>
      <h1>Start a Trove</h1>
      <p class="sub" style="font-size:16px;color:var(--body)">A Trove keeps people in the loop about your club, street, shop or group. It takes a minute.</p>
      <label class="label" for="ch-name">What's it called?</label>
      <input class="input" id="ch-name" placeholder="Lenna St neighbours" value="${esc(n.name)}" autocomplete="off">
      <p class="label">What is it?</p>
      <div class="pills">${KINDS.map((k) => `<button type="button" class="pill" aria-pressed="${n.kind === k}" data-act="ch-kind" data-arg="${k}">${k}</button>`).join('')}</div>
      <p class="label">Who can subscribe?</p>
      <button type="button" class="choice" aria-pressed="${n.access === 'invite'}" data-act="ch-access" data-arg="invite"><span class="radio"></span><span class="grow" style="gap:2px"><b>People I invite</b><span class="sub">By link or QR code. Ready straight away.</span></span></button>
      <button type="button" class="choice" aria-pressed="${n.access === 'public'}" data-act="ch-access" data-arg="public"><span class="radio"></span><span class="grow" style="gap:2px"><b>Anyone nearby</b><span class="sub">Shows on the radar. We check public Troves within a day.</span></span></button>
      <button type="button" class="btn" id="ch-create" data-act="create" style="margin-top:auto" ${n.name.trim() ? '' : 'disabled'}>Create Trove</button>
      <p class="demo-note">Free during the pilot.</p>`;
  }

  function mineDetail() {
    const c = conn(S.connId), s = strength(c.verified);
    const posts = S.posts.filter((p) => p.conn === c.id).sort((a, b) => b.id - a.id);
    const n = subs(c);
    return `<button type="button" class="back" data-act="go" data-arg="troves">‹ Your Troves</button>
      <div class="row" style="flex-wrap:nowrap"><span class="avatar big ink">${esc(c.name[0])}</span>
        <div class="grow"><h2>${esc(c.name)}</h2><span class="row" style="gap:6px"><span class="tag you">You run this</span><span class="tag t1">${c.access === 'public' ? (c.checked ? 'On the radar' : 'Public · being checked') : 'Invite only'}</span></span></div></div>
      <button type="button" class="btn" data-act="share-to" data-arg="${c.id}">Send a ping</button>
      <div class="panel">
        <span class="row" style="gap:10px;flex-wrap:nowrap">${meter(s)}<span><b>${s ? STRENGTH[s] : 'Too faint to show'}</b><br><span class="sub">You confirmed your details ${ago(c.verified)}</span></span></span>
        <p class="sub">Your ping weakens as your details get older. Confirm they're still right to keep it strong.</p>
        <div class="row"><button type="button" class="btn small" data-act="reverify">Everything's still right</button>
        <button type="button" class="demo-btn" data-act="age">Prototype: 2 months pass</button></div>
      </div>
      <div class="panel">
        <p class="label"><span class="stat">${n}</span> subscriber${n === 1 ? '' : 's'}</p>
        ${n ? `<p class="sub">${c.audience[4]} want urgent only · ${c.audience[1]} want everything · ${c.audience.ai} use their AI</p>` : '<p class="sub">Nobody yet. Invite people with your link or poster.</p>'}
        <div class="minirow"><span class="miniqr">${qrSvg}</span>
          <div class="grow"><p style="font-weight:600;font-size:14px;word-break:break-all;font-family:var(--mono)">sub1/${esc(c.id)}</p>
            <div class="row" style="gap:8px"><button type="button" class="btn small" data-act="copy-invite" data-arg="${c.id}">Copy invite link</button>
            <button type="button" class="link-btn" data-act="soon" data-arg="Poster downloads">Get the poster</button></div></div></div>
        <button type="button" class="demo-btn" data-act="sim-join">Prototype: 12 people scan your poster</button>
      </div>
      <p class="label">Documents</p>
      <p class="sub">Subscribers can ask questions of these instead of messaging you.</p>
      ${c.docs.map((d) => `<details class="doc"><summary>${esc(d.t)}</summary><p>${esc(d.b)}</p></details>`).join('')}
      ${S.addingDoc ? `<form class="panel" data-form="doc"><label class="label" for="doc-t">Page title</label><input class="input" id="doc-t" placeholder="Wet weather plan" autocomplete="off">
          <label class="label" for="doc-b">What should people know?</label><textarea class="input" id="doc-b" style="height:110px;font-size:15px" placeholder="If it's raining at 7am…"></textarea>
          <div class="row"><button class="btn small" type="submit">Add page</button><button type="button" class="link-btn" data-act="doc-cancel">Cancel</button></div></form>`
        : '<button type="button" class="btn dashed small" data-act="doc-add">+ Add a page</button>'}
      <p class="label">Past pings</p>
      ${posts.length ? posts.map((p) => `<div class="card"><div class="meta">${tag(p.pri)}<span>${esc(p.time)}</span></div><p class="msg">${esc(p.text)}</p>${p.reach ? `<p class="sub">${esc(p.reach)}</p>` : ''}</div>`).join('') : '<div class="empty">No pings sent yet.</div>'}`;
  }

  function compose() {
    const mine = owned();
    if (!mine.length) return start();
    const d = S.draft;
    if (!d.ch || !conn(d.ch) || !conn(d.ch).owner) d.ch = mine[0].id;
    const c = conn(d.ch), s = suggest(d.text), r = reachFor(c, d.pri);
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Home</button>${mine.length > 1
        ? `<label class="label" for="ch-pick">Pinging from</label><select class="input" id="ch-pick">${mine.map((m) => `<option value="${m.id}" ${m.id === c.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
        : `<p class="sub" style="font-weight:600">${esc(c.name)}</p>`}
      <h1>What's the news?</h1>
      <label for="draft" style="position:absolute;left:-9999px">Message</label>
      <textarea class="input" id="draft" placeholder="Saturday games move to 9am at the Domain courts…">${esc(d.text)}</textarea>
      <button type="button" class="link-btn" data-act="example" style="align-self:flex-start;padding:0">Use an example</button>
      <p class="label">Is it urgent?</p>
      <div class="pills" id="pri-pills">${[1, 4].map((l) => `<button type="button" class="pill" aria-pressed="${d.pri === l}" data-act="pri" data-arg="${l}">${l === 4 ? 'Urgent' : 'Not urgent'}</button>`).join('')}</div>
      <p class="sub" id="why" style="font-size:15px;color:var(--body)">${whyText(s)}</p>
      <div class="reach" id="reach">${reachText(r)}</div>
      <div class="row" style="margin-top:auto"><button type="button" class="btn" id="share" data-act="share" ${d.text.trim() ? '' : 'disabled'}>Send ping</button>
      <button type="button" class="btn ghost" data-act="soon" data-arg="Scheduling">Later</button></div>`;
  }
  const whyText = (s) => !s ? "Write something and we'll suggest whether it's urgent. Urgent pings notify everyone, including people who only want urgent ones."
    : S.draft.manual && S.draft.pri !== s.pri ? `You picked <b>${LEVELS[S.draft.pri].toLowerCase()}</b>. We'd have said ${LEVELS[s.pri].toLowerCase()}, because ${s.why}.`
    : `We think it's <b>${LEVELS[s.pri].toLowerCase()}</b>: ${s.why}. Change it if we're wrong.`;
  const reachText = (r) => r.pinged + r.quiet + r.ai === 0
    ? 'Nobody has subscribed yet, so this will wait in your Trove. Invite people from Your Troves.'
    : `<b class="stat">${r.pinged} ${r.pinged === 1 ? 'person' : 'people'}</b> will get a ping. <span class="stat">${r.quiet}</span> more will see it next time they look. <span class="stat">${r.ai}</span> have their AI keeping watch.`;

  // ---------- Ask and your AI ----------
  function ask() {
    const msgs = S.chat.map((m) => `<div class="bubble ${m.who}">${m.who === 'ai' ? m.html : esc(m.text)}</div>`).join('');
    const sugg = ["What's on for me this week?", 'What do I need for Saturday?', 'Is school on Friday?', "When's the next working bee?"];
    return `<div class="topline" style="justify-content:space-between"><h1>Ask</h1><button type="button" class="btn ghost small" data-act="go" data-arg="home">Done</button></div>
      <p class="sub">Answers come from your Troves' pings and documents.</p>
      ${msgs || `<div class="chips">${sugg.map((q) => `<button type="button" class="chip" data-act="ask" data-arg="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}
      <p class="demo-note">Prototype: answers are matched from the sample data, not a real AI.</p>`;
  }

  function ai() {
    return `<button type="button" class="back" data-act="go" data-arg="home">‹ Home</button><h1>Connect your AI</h1>
      <p class="sub" style="font-size:16px;color:var(--body)">Let your own assistant read your pings and documents. It only sees the Troves you allow. No tech skills needed.</p>
      <div class="card" style="gap:12px"><p class="label">1. Copy your link</p>
        <div class="row" style="flex-wrap:nowrap"><input class="input" id="mcp-link" readonly value="https://[domain]/mcp" style="font-family:var(--mono);font-size:14px;background:#FFFFFF">
        <button type="button" class="btn small" data-act="copy">Copy</button></div>
        <p class="label">2. Paste it into your assistant</p><p class="sub">We'll show you exactly where for the one you use. Your AI can send pings from Troves you run, too.</p></div>
      <div class="setting"><span><b>Pull only</b><br><span class="sub">No notifications at all. My AI checks when it wants.</span></span>
        <button type="button" class="switch" role="switch" aria-checked="${S.pullOnly}" aria-label="Pull only" data-act="pull"><span></span></button></div>
      <div class="card"><p class="label">Daily digest</p><p class="sub">A morning summary of your quiet pings, written your way. Coming later.</p></div>`;
  }

  function answer(q) {
    const t = q.toLowerCase();
    const mine = S.connections.filter((c) => c.joined);
    if (/this week|what's on|whats on|today/.test(t)) {
      const items = myPosts().slice(0, 4);
      return 'Here’s what’s coming up:\n' + items.map((p) => `• <b>${esc(conn(p.conn).short)}:</b> ${esc(p.text)}`).join('\n');
    }
    const words = t.replace(/need/g, 'bring').match(/[a-z]{4,}/g) || [];
    const score = (s) => words.reduce((n, w) => n + (s.toLowerCase().includes(w.slice(0, 5)) ? 1 : 0), 0);
    const hits = [];
    for (const c of mine) {
      for (const d of c.docs) hits.push({ s: score(d.t + ' ' + d.b), html: `<b>${esc(c.short)} · ${esc(d.t)}:</b> ${esc(d.b)}` });
      for (const p of S.posts.filter((x) => x.conn === c.id)) { const s = score(p.text); hits.push({ s: s + (s > 0 ? 0.5 : 0), html: `<b>${esc(c.short)} ping:</b> ${esc(p.text)}` }); }
    }
    const top = hits.filter((h) => h.s > 0).sort((a, b) => b.s - a.s).slice(0, 2);
    return top.length ? top.map((h) => h.html).join('\n\n') : "I couldn't find that in your Troves' pings or documents. Try asking about a club, school or shop you subscribe to.";
  }
  function doAsk(q) {
    if (!q.trim()) return;
    S.chat.push({ who: 'me', text: q }, { who: 'ai', html: answer(q) });
    S.screen = 'ask'; render();
  }

  // ---------- Shell ----------
  function floatBar() {
    return `<div class="fab">
      <form class="fab-ask" data-form="ask">
        <label for="float-ask" style="position:absolute;left:-9999px">Ask about anything you subscribe to</label>
        <input class="input" id="float-ask" placeholder="Ask anything" autocomplete="off">
        <button class="fab-send" type="submit" aria-label="Ask">↑</button></form></div>`;
  }
  function menuSheet() {
    const item = (act, arg, ic, label, extra = '') => `<button type="button" class="sheet-item" data-act="${act}" data-arg="${arg}"><span class="iconbtn">${ic}</span><span class="grow">${label}</span>${extra}</button>`;
    const mine = owned().map((c) => item('menu-mine', c.id, `<b style="font-family:var(--display)">${esc(c.name[0])}</b>`, esc(c.name), `<span class="tag you">${subs(c)}</span>`)).join('');
    return `<div class="backdrop" data-act="sheet-close"></div>
      <div class="sheet" role="dialog" aria-label="Menu"><span class="grabber"></span>
        ${owned().length ? item('menu-go', 'share', icon.pen, 'Send a ping') : ''}
        ${item('menu-go', 'troves', icon.people, 'Your Troves', `<span class="sub">${S.connections.filter((c) => c.joined && !c.owner).length} subscribed</span>`)}
        ${mine ? `<p class="section-h" style="padding:0 10px">Troves you run</p>${mine}` : ''}
        ${item('menu-go', 'start', icon.plus, 'Start a Trove')}
        ${item('menu-go', 'scan', icon.scan, 'Scan a code')}
        ${item('menu-go', 'ai', icon.plug, 'Your AI and settings')}
      </div>`;
  }

  const SCREENS = { home, feed: home, ping: pingView, trove: troveFeed, radar, troves, conn: connDetail, mine: mineDetail, scan, subscribe, joined, start, share: compose, ask, ai };
  function render() {
    const el = $('screen');
    const fab = ['home', 'feed', 'ask'].includes(S.screen);
    el.className = 'screen' + (S.screen === 'subscribe' ? ' flush' : '') + (fab ? ' has-fab' : '') + (S.screen === 'radar' ? ' radar-screen' : '');
    el.innerHTML = (SCREENS[S.screen] || home)();
    $('float').innerHTML = fab ? floatBar() : '';
    $('sheet').innerHTML = S.sheet === 'menu' ? menuSheet() : S.sheet ? troveSheet(conn(S.sheet)) : '';
    if (S.screen === 'ask') el.scrollTop = el.scrollHeight;
  }
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function copyText(text, inputId) {
    const fallback = () => { const i = inputId && $(inputId); if (i) i.select(); toast(inputId ? 'Link selected. Copy it from here.' : text); };
    try { navigator.clipboard.writeText(text).then(() => toast('Link copied'), fallback); } catch (e) { fallback(); }
  }

  // ---------- Actions ----------
  const act = {
    reset: () => { S = fresh(); render(); toast('Prototype reset'); },
    go: (a) => {
      S.screen = a; S.addingDoc = false; S.sheet = null; render(); scrollTop();
      if (a === 'feed' || a === 'home') S.posts.forEach((p) => { p.isNew = false; p.wasUnread = false; });
    },
    menu: () => { S.sheet = 'menu'; render(); },
    'sheet-close': () => { S.sheet = null; render(); },
    'menu-go': (a) => act.go(a),
    'menu-mine': (a) => { S.sheet = null; act['open-mine'](a); },
    trove: (a) => { S.sheet = a; render(); },
    quiet: () => { const y = $('screen').scrollTop; S.showQuiet = !S.showQuiet; render(); $('screen').scrollTop = y; },
    'open-ping': (a) => { S.back = S.screen === 'trove' ? 'trove' : 'home'; S.pingId = +a; const p = S.posts.find((x) => x.id === +a); if (p) { p.isNew = false; p.read = true; } S.screen = 'ping'; render(); scrollTop(); },
    'open-trove': (a) => {
      S.troveId = a; S.screen = 'trove';
      S.posts.forEach((p) => { if (p.conn === a) { p.wasUnread = !p.read; p.read = true; } });
      render(); scrollTop();
    },
    filter: (a) => { S.filter = a === 'all' ? 'all' : +a; S.fmenu = false; render(); },
    fmenu: () => { S.fmenu = !S.fmenu; render(); },
    expand: (a) => { S.open[a] = !S.open[a]; const y = $('screen').scrollTop; render(); $('screen').scrollTop = y; },
    'open-conn': (a) => { S.connId = a; S.screen = 'conn'; S.sheet = null; render(); scrollTop(); },
    'open-mine': (a) => { S.connId = a; S.screen = 'mine'; S.addingDoc = false; render(); scrollTop(); },
    'toggle-conn': () => { const c = conn(S.connId); c.on = !c.on; render(); toast(c.on ? `Notifications on for ${c.short}` : `${c.short} paused`); },
    level: (a) => { const c = conn(S.connId); c.level = +a; render(); toast(`${c.short}: ${LINE[a].toLowerCase()}`); },
    via: (a) => { if (a === 'SMS') { toast('SMS is on the Plus plan. Coming later.'); return; } conn(S.connId).via = a; render(); },
    leave: () => { const c = conn(S.connId); c.joined = false; S.screen = 'troves'; render(); toast(`Unsubscribed from ${c.short}`); },
    noop: () => {},
    'sub-start': (a) => { S.subId = a; S.scanLevel = 1; S.sheet = null; S.screen = 'subscribe'; render(); scrollTop(); },
    'scan-level': (a) => { S.scanLevel = +a; render(); },
    join: (a) => { const c = conn(S.subId); Object.assign(c, { joined: true, on: true, level: S.scanLevel, via: a }); S.screen = 'joined'; render(); },
    ask: (a) => doAsk(a),
    pull: () => { S.pullOnly = !S.pullOnly; render(); toast(S.pullOnly ? 'Pull only on. Nothing will ping you.' : 'Pull only off'); },
    copy: () => copyText($('mcp-link').value, 'mcp-link'),
    'copy-invite': (a) => copyText(`https://[domain]/${a}`),
    'ch-kind': (a) => { S.newCh.kind = a; render(); },
    'ch-access': (a) => { S.newCh.access = a; render(); },
    create: () => {
      const n = S.newCh; if (!n.name.trim()) return;
      const name = n.name.trim();
      const id = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'trove') + '-' + (++S.seq);
      S.connections.unshift({ id, name, short: name.length > 22 ? name.slice(0, 21) + '…' : name, owner: true, joined: true, on: true, level: 1, via: 'Email', kind: n.kind, access: n.access, checked: false, verified: 0, audience: EMPTY_AUD(), docs: [] });
      S.newCh = { name: '', kind: 'Club or team', access: 'invite' };
      S.connId = id; S.screen = 'mine'; S.draft.ch = id;
      render(); scrollTop(); toast(`${name} is ready. Invite some people.`);
    },
    'sim-join': () => {
      const c = conn(S.connId);
      [[4, 3], [1, 8], ['ai', 1]].forEach(([k, v]) => { c.audience[k] += v; });
      if (c.access === 'public') c.checked = true;
      render(); toast('12 people subscribed from your poster');
    },
    reverify: () => { const c = conn(S.connId); c.verified = 0; render(); toast('Confirmed. Your ping is strong again.'); },
    age: () => { const c = conn(S.connId); c.verified += 60; const s = strength(c.verified); render(); toast(`Two months later: ${s ? STRENGTH[s].toLowerCase() : 'too faint to show'}`); },
    'doc-add': () => { S.addingDoc = true; render(); const i = $('doc-t'); if (i) i.focus(); },
    'doc-cancel': () => { S.addingDoc = false; render(); },
    'share-to': (a) => { S.draft.ch = a; S.screen = 'share'; render(); scrollTop(); },
    pri: (a) => { S.draft.pri = +a; S.draft.manual = true; updateCompose(); },
    example: () => { Object.assign(S.draft, { text: 'Training is cancelled tonight because of the storm warning. Stay safe and see you Saturday.', pri: 4, manual: false }); render(); },
    share: () => {
      const d = S.draft; if (!d.text.trim()) return;
      const c = conn(d.ch), r = reachFor(c, d.pri);
      S.posts.push({ id: ++S.seq, read: true, conn: c.id, pri: d.pri, text: d.text.trim(), time: 'Just now', isNew: true, reach: `${r.pinged} pinged · ${r.quiet} in feed · ${r.ai} AI` });
      Object.assign(S.draft, { text: '', pri: 1, manual: false });
      c.verified = 0;
      S.screen = 'home';
      render(); scrollTop(); toast(r.pinged + r.quiet + r.ai ? `Ping sent. ${r.pinged} pinged.` : 'Ping sent. It will be waiting when people subscribe.');
    },
    soon: (a) => toast(`${a}: coming later`)
  };

  function updateCompose() {
    const s = suggest(S.draft.text);
    if (s && !S.draft.manual) S.draft.pri = s.pri;
    document.querySelectorAll('#pri-pills .pill').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.arg === S.draft.pri));
    $('why').innerHTML = whyText(s);
    $('reach').innerHTML = reachText(reachFor(conn(S.draft.ch), S.draft.pri));
    $('share').disabled = !S.draft.text.trim();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const f = act[b.dataset.act];
    if (f) f(b.dataset.arg);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'draft') { S.draft.text = e.target.value; if (!e.target.value.trim()) S.draft.manual = false; updateCompose(); }
    if (e.target.id === 'ch-name') { S.newCh.name = e.target.value; $('ch-create').disabled = !e.target.value.trim(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'ch-pick') { S.draft.ch = e.target.value; updateCompose(); }
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.dataset.form; if (!f) return;
    e.preventDefault();
    if (f === 'ask') doAsk(e.target.querySelector('input').value);
    if (f === 'doc') {
      const t = $('doc-t').value.trim(), b = $('doc-b').value.trim();
      if (!t || !b) { toast('Add a title and some text first'); return; }
      const c = conn(S.connId); c.docs.push({ t, b }); c.verified = 0; S.addingDoc = false; render(); toast('Page added. Subscribers can ask about it now.');
    }
  });

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => S);
  const boot = (data) => { if (data && data.v === 9) S = Object.assign(fresh(), data, { sheet: null }); render(); };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
